<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>River Survey Dashboard</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.31/"></script>

  <style>
    html, body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      font-size: 14px;
    }

    #appContainer {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* --- Left sidebar: filters --- */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      padding: 16px;
      background: #f4f4f4;
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 16px;
      margin-top: 0;
    }

    #sidebar label {
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 13px;
    }

    #orgFilter {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    #locationCount {
      margin-top: 16px;
      font-size: 13px;
      color: #444;
    }

    /* --- Center: the map --- */
    #viewDiv {
      flex-grow: 1;
      height: 100%;
    }

    /* --- Right panel: location details --- */
    #detailsPanel {
      width: 320px;
      flex-shrink: 0;
      padding: 16px;
      background: #fff;
      border-left: 1px solid #ccc;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #detailsPanel h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 2px;
    }

    #detailsPanel .orgName {
      color: #666;
      font-size: 13px;
      margin-bottom: 12px;
    }

    #detailsPlaceholder {
      color: #888;
      font-size: 13px;
    }

    .statGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .statBox {
      background: #f4f4f4;
      border-radius: 4px;
      padding: 8px;
    }

    .statBox .value {
      font-size: 18px;
      font-weight: bold;
    }

    .statBox .label {
      font-size: 11px;
      color: #666;
    }

    .wildlifeTags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .wildlifeTag {
      background: #e3f2e1;
      color: #2c5c28;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 12px;
    }

    #detailsPanel h3 {
      font-size: 13px;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-bottom: 8px;
    }

    .observationRow {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      font-size: 12px;
    }

    .observationRow .obsDate {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .observationRow .obsMetric {
      color: #555;
    }

    /* --- Water quality trend chart --- */
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --series-1:       #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      .viz-root {
        color-scheme: dark;
        --surface-1:      #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted:     #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --series-1:       #3987e5;
      }
    }

    .chartControls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chartControls label {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    #metricPicker {
      flex: 1;
      padding: 4px 6px;
      font-size: 12px;
      box-sizing: border-box;
    }

    .chartTitle {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .chartWrap {
      position: relative;
      background: var(--surface-1);
    }

    .chartWrap svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .chartWrap svg text {
      font-family: sans-serif;
    }

    .chartEmpty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 12px 0 4px;
    }

    .chartTooltip {
      position: absolute;
      pointer-events: none;
      background: var(--text-primary);
      color: var(--surface-1);
      font-size: 11px;
      line-height: 1.4;
      padding: 4px 7px;
      border-radius: 4px;
      transform: translate(-50%, -100%) translateY(-8px);
      white-space: nowrap;
    }

    .chartTooltip .ttValue {
      font-weight: bold;
    }

    .chartTooltip .ttDate {
      opacity: 0.75;
    }
  </style>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer"
    ], function (Map, MapView, FeatureLayer) {

      const BASE_URL = "https://services3.arcgis.com/Bb8lfThdhugyc4G3/arcgis/rest/services/National_River_Survey_Testing_Layer/FeatureServer";

      // Styled here in code rather than relying on the renderer saved in
      // ArcGIS Online, so the look is guaranteed regardless of what's set
      // (or not yet propagated) on the hosted layer itself.

      // Outline only, no fill - modern look that draws attention to the
      // shape without covering the basemap. The fill is fully transparent
      // rather than removed entirely, since a transparent fill (unlike no
      // fill symbol at all) still lets clicks on the polygon's interior
      // register as hits, not just clicks on the outline itself.
      const organisationRenderer = {
        type: "simple",
        symbol: {
          type: "simple-fill",
          color: [0, 0, 0, 0],
          outline: {
            color: "#1f6feb",
            width: 2
          }
        }
      };

      const locationsRenderer = {
        type: "simple",
        symbol: {
          type: "simple-marker",
          style: "circle",
          color: "#e8590c",
          size: 8,
          outline: {
            color: "#ffffff",
            width: 1
          }
        }
      };

      // The map layer - shows organisations as polygons.
      // This is the default layer shown on the map.
      const organisationLayer = new FeatureLayer({
        url: BASE_URL + "/0",
        outFields: ["*"],
        popupEnabled: false, // we're building our own details panel instead
        renderer: organisationRenderer
      });

      // The map layer - shows survey locations as points.
      // Hidden until an organisation has been selected (via the dropdown
      // or by clicking its polygon on the map), at which point it's
      // filtered down to that org's locations and shown.
      const locationsLayer = new FeatureLayer({
        url: BASE_URL + "/1",
        outFields: ["*"],
        popupEnabled: false, // we're building our own details panel instead
        visible: false,
        renderer: locationsRenderer
      });

      // Used only for querying observation history - never added to the map
      const observationsTable = new FeatureLayer({
        url: BASE_URL + "/2"
      });

      const map = new Map({
        basemap: "topo-vector",
        layers: [organisationLayer, locationsLayer]
      });

      // Kept as constants so we can return to this starting view later
      // (e.g. when the organisation selection is cleared).
      const INITIAL_CENTER = [-1.5, 53.15];
      const INITIAL_ZOOM = 7;

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: INITIAL_CENTER,
        zoom: INITIAL_ZOOM
      });

      const orgFilter = document.getElementById("orgFilter");
      const locationCount = document.getElementById("locationCount");

      // --- Populate the organisation dropdown with real values from the data ---
      // We query for DISTINCT organisation_name values rather than hardcoding
      // them, so this stays correct if organisations are added/removed later.
      organisationLayer.when(function () {
        const query = organisationLayer.createQuery();
        query.outFields = ["organisation_name"];
        query.returnDistinctValues = true;
        query.orderByFields = ["organisation_name"];

        organisationLayer.queryFeatures(query).then(function (result) {
          result.features.forEach(function (feature) {
            const name = feature.attributes.organisation_name;
            if (!name) return; // skip blank/null values
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            orgFilter.appendChild(option);
          });
        });
      });

      orgFilter.addEventListener("change", function () {
        selectOrganisation(orgFilter.value);
      });

      // --- Select an organisation: hide every other organisation's polygon,
      //     zoom the map to the selected one, then show its survey
      //     locations. Call with no name (e.g. "All organisations") to
      //     clear the selection, bring back every polygon, hide the
      //     locations again, and return to the original starting view.
      //
      //     `geometry` is optional - when we already have it (e.g. from
      //     clicking the polygon directly) we skip the extra query and
      //     zoom straight to it. The dropdown doesn't have geometry on
      //     hand, so it's looked up. ---
      function selectOrganisation(orgName, geometry) {
        orgFilter.value = orgName || "";

        if (!orgName) {
          organisationLayer.definitionExpression = "";
          locationsLayer.visible = false;
          locationsLayer.definitionExpression = "";
          locationCount.innerText = "Select an organisation to see its locations";

          view.goTo({ center: INITIAL_CENTER, zoom: INITIAL_ZOOM });
          return;
        }

        // Escape single quotes in case an org name ever contains one
        const escapedName = orgName.replace(/'/g, "''");

        // Hide every other organisation's polygon, leaving only the
        // selected one on the map.
        organisationLayer.definitionExpression = `organisation_name = '${escapedName}'`;

        if (geometry) {
          view.goTo(geometry);
        } else {
          const query = organisationLayer.createQuery();
          query.where = `organisation_name = '${escapedName}'`;
          query.returnGeometry = true;
          query.outFields = ["organisation_name"];

          organisationLayer.queryFeatures(query).then(function (result) {
            if (result.features.length > 0) {
              view.goTo(result.features[0].geometry);
            }
          });
        }

        locationsLayer.definitionExpression = `organisationName = '${escapedName}'`;
        locationsLayer.visible = true;
        updateLocationCount();
      }

      function updateLocationCount() {
        locationsLayer.queryFeatureCount(locationsLayer.createQuery()).then(function (count) {
          locationCount.innerText = count.toLocaleString() + " locations shown";
        });
      }

      // --- Click a location point to see its details, or click an
      //     organisation polygon to select/zoom into that organisation ---
      view.on("click", function (event) {
        view.hitTest(event).then(function (response) {
          const locationResult = response.results.find(function (r) {
            return r.graphic && r.graphic.layer === locationsLayer;
          });

          if (locationResult) {
            showLocationDetails(locationResult.graphic);
            return;
          }

          const orgResult = response.results.find(function (r) {
            return r.graphic && r.graphic.layer === organisationLayer;
          });

          if (orgResult) {
            const orgName = orgResult.graphic.attributes.organisation_name;
            if (orgName) selectOrganisation(orgName, orgResult.graphic.geometry);
          }
        });
      });

      function showLocationDetails(graphic) {
        const attrs = graphic.attributes;

        document.getElementById("detailsPlaceholder").style.display = "none";
        document.getElementById("detailsContent").style.display = "block";

        document.getElementById("locationName").innerText = attrs.locationName || "(unnamed location)";
        document.getElementById("locationOrg").innerText = attrs.organisationName || "";

        // These stats are already stored on the location itself - no extra query needed
        document.getElementById("statSurveys").innerText = attrs.totalSurveys ?? "-";
        document.getElementById("statPhosphate").innerText = formatNumber(attrs.phosphateAverage);
        document.getElementById("statNitrate").innerText = formatNumber(attrs.nitrateAverage);
        document.getElementById("statTurbidity").innerText = formatNumber(attrs.turbidityAverage);

        // Build wildlife tags for any species with a count greater than 0
        const wildlifeFields = [
          { field: "otter", label: "Otter" },
          { field: "dipper", label: "Dipper" },
          { field: "waterVole", label: "Water Vole" },
          { field: "kingfisher", label: "Kingfisher" },
          { field: "dragonfliesOrDamselflies", label: "Dragonflies/Damselflies" },
          { field: "heron", label: "Heron" },
          { field: "fish", label: "Fish" },
          { field: "greyWagtail", label: "Grey Wagtail" },
          { field: "bats", label: "Bats" },
          { field: "mayfliesOrCaddisflies", label: "Mayflies/Caddisflies" }
        ];

        const tagsContainer = document.getElementById("wildlifeTags");
        tagsContainer.innerHTML = "";
        wildlifeFields.forEach(function (w) {
          if (attrs[w.field] > 0) {
            const tag = document.createElement("span");
            tag.className = "wildlifeTag";
            tag.textContent = w.label + " (" + attrs[w.field] + ")";
            tagsContainer.appendChild(tag);
          }
        });

        loadObservations(attrs.locationID);
      }

      function formatNumber(value) {
        return (value === null || value === undefined) ? "-" : Number(value).toFixed(1);
      }

      // --- The metrics the trend chart can plot, and the picker that
      //     drives it. `currentObservations` holds the full, ascending-by-
      //     date survey history for whichever location is currently open -
      //     fetched once per location click, then re-used (no requery) each
      //     time the picker switches metric. ---
      const METRIC_DEFS = [
        { field: "phosphate", label: "Phosphate" },
        { field: "nitrate", label: "Nitrate" },
        { field: "nitrite", label: "Nitrite" },
        { field: "ammonia", label: "Ammonia" },
        { field: "turbidity", label: "Turbidity" },
        { field: "conductivity", label: "Conductivity" },
        { field: "water_temperature", label: "Water temperature" }
      ];

      let currentObservations = [];

      document.getElementById("metricPicker").addEventListener("change", renderChart);

      // --- Query the Observations table for this location's full survey
      //     history. locationID is a GUID field - the value from the
      //     location graphic already comes back wrapped in curly braces,
      //     so we just quote it. ---
      function loadObservations(locationID) {
        const listEl = document.getElementById("observationsList");
        listEl.innerHTML = "Loading recent surveys...";
        currentObservations = [];
        renderChart();

        if (!locationID) {
          listEl.innerHTML = "No location ID available.";
          return;
        }

        const query = observationsTable.createQuery();
        query.where = `locationID = '${locationID}'`;
        query.outFields = [
          "created_at", "water_temperature", "conductivity",
          "turbidity", "phosphate", "nitrate", "nitrite",
          "ammonia", "clarity", "water_level", "water_flow"
        ];
        query.orderByFields = ["created_at ASC"]; // ascending - the chart needs oldest-first

        observationsTable.queryFeatures(query).then(function (result) {
          currentObservations = result.features;

          if (result.features.length === 0) {
            listEl.innerHTML = "<p style='color:#888;'>No survey records found for this location.</p>";
            renderChart();
            return;
          }

          // The list still shows the most recent 10, newest first.
          const recent = currentObservations.slice(-10).reverse();

          listEl.innerHTML = "";
          recent.forEach(function (feature) {
            const a = feature.attributes;
            const row = document.createElement("div");
            row.className = "observationRow";

            const dateStr = a.created_at
              ? new Date(a.created_at).toLocaleDateString()
              : "Unknown date";

            row.innerHTML = `
              <div class="obsDate">${dateStr}</div>
              <div class="obsMetric">Clarity: ${a.clarity ?? "-"} | Flow: ${a.water_flow ?? "-"} | Level: ${a.water_level ?? "-"}</div>
              <div class="obsMetric">Phosphate: ${a.phosphate ?? "-"} | Nitrate: ${a.nitrate ?? "-"} | Ammonia: ${a.ammonia ?? "-"}</div>
            `;
            listEl.appendChild(row);
          });

          renderChart();
        }).catch(function (error) {
          listEl.innerHTML = "<p style='color:#a00;'>Couldn't load observations.</p>";
          console.error(error);
          renderChart();
        });
      }

      // --- Draw the trend chart for whichever metric is currently picked,
      //     from the already-fetched `currentObservations`. A line chart is
      //     the right form here (a single measurement, changing over time),
      //     so it gets one series in the sequential accent hue, a crosshair
      //     that snaps to the nearest reading, and a direct label on the
      //     most recent value - no legend box, since the title already
      //     names the one thing being plotted. ---
      function renderChart() {
        const svg = document.getElementById("trendChartSvg");
        const tooltip = document.getElementById("chartTooltip");
        const emptyEl = document.getElementById("chartEmpty");
        const titleEl = document.getElementById("chartTitle");
        const metricPicker = document.getElementById("metricPicker");

        const metric = METRIC_DEFS.find(function (m) { return m.field === metricPicker.value; }) || METRIC_DEFS[0];
        titleEl.textContent = metric.label + " over time";

        svg.innerHTML = "";
        tooltip.hidden = true;

        const points = currentObservations
          .map(function (f) {
            return { date: f.attributes.created_at, value: f.attributes[metric.field] };
          })
          .filter(function (p) {
            return p.date !== null && p.date !== undefined && p.value !== null && p.value !== undefined;
          });

        if (points.length < 2) {
          svg.style.display = "none";
          emptyEl.hidden = false;
          emptyEl.textContent = points.length === 0
            ? "No " + metric.label.toLowerCase() + " readings recorded for this location."
            : "Only one " + metric.label.toLowerCase() + " reading recorded - not enough to chart a trend.";
          return;
        }

        svg.style.display = "block";
        emptyEl.hidden = true;

        // --- Layout ---
        const width = 300, height = 170;
        const marginLeft = 38, marginRight = 12, marginTop = 12, marginBottom = 24;
        const plotW = width - marginLeft - marginRight;
        const plotH = height - marginTop - marginBottom;

        svg.setAttribute("viewBox", "0 0 " + width + " " + height);

        const xMin = points[0].date;
        const xMax = points[points.length - 1].date;
        const rawValues = points.map(function (p) { return p.value; });
        const yTicks = niceTicks(Math.min.apply(null, rawValues), Math.max.apply(null, rawValues), 4);

        function xScale(d) {
          return xMax === xMin ? marginLeft + plotW / 2 : marginLeft + ((d - xMin) / (xMax - xMin)) * plotW;
        }
        function yScale(v) {
          return yTicks.max === yTicks.min
            ? marginTop + plotH / 2
            : marginTop + plotH - ((v - yTicks.min) / (yTicks.max - yTicks.min)) * plotH;
        }

        const svgNS = "http://www.w3.org/2000/svg";
        const rootStyle = getComputedStyle(document.getElementById("trendChartRoot"));
        const colGrid = rootStyle.getPropertyValue("--gridline").trim();
        const colMuted = rootStyle.getPropertyValue("--text-muted").trim();
        const colBaseline = rootStyle.getPropertyValue("--baseline").trim();
        const colSeries = rootStyle.getPropertyValue("--series-1").trim();
        const colSurface = rootStyle.getPropertyValue("--surface-1").trim();
        const colText = rootStyle.getPropertyValue("--text-primary").trim();

        function addEl(tag, attrs) {
          const el = document.createElementNS(svgNS, tag);
          Object.keys(attrs).forEach(function (key) { el.setAttribute(key, attrs[key]); });
          svg.appendChild(el);
          return el;
        }

        // Gridlines + y-axis tick labels (recessive - hairline, one step off surface)
        yTicks.ticks.forEach(function (t) {
          const y = yScale(t);
          addEl("line", { x1: marginLeft, x2: width - marginRight, y1: y, y2: y, stroke: colGrid, "stroke-width": 1 });
          addEl("text", { x: marginLeft - 6, y: y + 3, "text-anchor": "end", "font-size": 9, fill: colMuted })
            .textContent = formatTickValue(t);
        });

        // Baseline
        addEl("line", {
          x1: marginLeft, x2: width - marginRight,
          y1: marginTop + plotH, y2: marginTop + plotH,
          stroke: colBaseline, "stroke-width": 1
        });

        // X-axis labels: first, middle, last - never every point
        const xLabelIdxs = points.length > 2
          ? [0, Math.floor((points.length - 1) / 2), points.length - 1]
          : [0, points.length - 1];
        xLabelIdxs.forEach(function (i) {
          const p = points[i];
          const anchor = i === 0 ? "start" : (i === points.length - 1 ? "end" : "middle");
          addEl("text", { x: xScale(p.date), y: height - 6, "text-anchor": anchor, "font-size": 9, fill: colMuted })
            .textContent = formatDateShort(p.date);
        });

        // The line itself - 2px, round join/cap
        const pathData = points.map(function (p, i) {
          return (i === 0 ? "M" : "L") + xScale(p.date).toFixed(1) + "," + yScale(p.value).toFixed(1);
        }).join(" ");
        addEl("path", {
          d: pathData, fill: "none", stroke: colSeries,
          "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
        });

        // End-of-line marker + direct label (the value the story is about)
        const last = points[points.length - 1];
        const endCx = xScale(last.date), endCy = yScale(last.value);
        addEl("circle", { cx: endCx, cy: endCy, r: 4, fill: colSeries, stroke: colSurface, "stroke-width": 2 });

        const labelNearRightEdge = endCx > width - marginRight - 30;
        addEl("text", {
          x: labelNearRightEdge ? endCx - 8 : endCx + 8,
          y: endCy - 8 < marginTop + 8 ? endCy + 14 : endCy - 8,
          "text-anchor": labelNearRightEdge ? "end" : "start",
          "font-size": 10, "font-weight": "bold", fill: colText
        }).textContent = formatTickValue(last.value);

        // Hover layer: crosshair + snapping tooltip, mouse and keyboard
        const crosshair = addEl("line", {
          y1: marginTop, y2: marginTop + plotH,
          stroke: colBaseline, "stroke-width": 1, visibility: "hidden"
        });
        const hoverDot = addEl("circle", {
          r: 5, fill: colSeries, stroke: colSurface, "stroke-width": 2, visibility: "hidden"
        });
        const overlay = addEl("rect", {
          x: marginLeft, y: marginTop, width: plotW, height: plotH,
          fill: "transparent", tabindex: 0
        });
        overlay.style.cursor = "crosshair";
        overlay.style.outline = "none";

        let hoverIdx = points.length - 1;

        function showPointAt(idx) {
          hoverIdx = Math.max(0, Math.min(points.length - 1, idx));
          const p = points[hoverIdx];
          const cx = xScale(p.date), cy = yScale(p.value);

          crosshair.setAttribute("x1", cx);
          crosshair.setAttribute("x2", cx);
          crosshair.setAttribute("visibility", "visible");
          hoverDot.setAttribute("cx", cx);
          hoverDot.setAttribute("cy", cy);
          hoverDot.setAttribute("visibility", "visible");

          const wrapRect = svg.parentElement.getBoundingClientRect();
          const scaleFactor = wrapRect.width / width;
          tooltip.style.left = (cx * scaleFactor) + "px";
          tooltip.style.top = (cy * scaleFactor) + "px";
          tooltip.innerHTML = "";
          const valueEl = document.createElement("div");
          valueEl.className = "ttValue";
          valueEl.textContent = formatTickValue(p.value);
          const dateEl = document.createElement("div");
          dateEl.className = "ttDate";
          dateEl.textContent = formatDateLong(p.date);
          tooltip.appendChild(valueEl);
          tooltip.appendChild(dateEl);
          tooltip.hidden = false;
        }

        function hidePoint() {
          crosshair.setAttribute("visibility", "hidden");
          hoverDot.setAttribute("visibility", "hidden");
          tooltip.hidden = true;
        }

        overlay.addEventListener("pointermove", function (evt) {
          const rect = svg.getBoundingClientRect();
          const px = (evt.clientX - rect.left) * (width / rect.width);
          let nearestIdx = 0, nearestDist = Infinity;
          points.forEach(function (p, i) {
            const d = Math.abs(xScale(p.date) - px);
            if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
          });
          showPointAt(nearestIdx);
        });
        overlay.addEventListener("pointerleave", hidePoint);
        overlay.addEventListener("focus", function () { showPointAt(hoverIdx); });
        overlay.addEventListener("blur", hidePoint);
        overlay.addEventListener("keydown", function (evt) {
          if (evt.key === "ArrowRight") { evt.preventDefault(); showPointAt(hoverIdx + 1); }
          else if (evt.key === "ArrowLeft") { evt.preventDefault(); showPointAt(hoverIdx - 1); }
        });
      }

      // "Nice" round tick values (like d3's ticks) rather than raw min/max
      // fractions - so the axis reads 0 / 0.5 / 1 rather than 0.137 / 0.482.
      function niceTicks(min, max, tickCount) {
        if (min === max) { min -= 1; max += 1; }
        const range = niceNumber(max - min, false);
        const step = niceNumber(range / (tickCount - 1), true);
        const niceMin = Math.floor(min / step) * step;
        const niceMax = Math.ceil(max / step) * step;
        const ticks = [];
        for (let v = niceMin; v <= niceMax + step / 2; v += step) {
          ticks.push(Math.round(v * 1000) / 1000);
        }
        return { min: niceMin, max: niceMax, ticks: ticks };
      }

      function niceNumber(value, round) {
        const exponent = Math.floor(Math.log10(value));
        const fraction = value / Math.pow(10, exponent);
        let niceFraction;
        if (round) {
          if (fraction < 1.5) niceFraction = 1;
          else if (fraction < 3) niceFraction = 2;
          else if (fraction < 7) niceFraction = 5;
          else niceFraction = 10;
        } else {
          if (fraction <= 1) niceFraction = 1;
          else if (fraction <= 2) niceFraction = 2;
          else if (fraction <= 5) niceFraction = 5;
          else niceFraction = 10;
        }
        return niceFraction * Math.pow(10, exponent);
      }

      function formatTickValue(v) {
        return (Math.round(v * 100) / 100).toLocaleString(undefined, { maximumFractionDigits: 2 });
      }

      function formatDateShort(ms) {
        return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      function formatDateLong(ms) {
        return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      }
    });
  </script>
